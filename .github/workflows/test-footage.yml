name: Test Wikimedia Footage Search

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-footage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Search Wikimedia Commons for test footage
        run: python src/footage.py --query "city timelapse" --limit 10
