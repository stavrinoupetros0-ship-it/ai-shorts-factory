
name: Test Wikimedia Footage Download

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-footage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Search and download verified test footage
        run: |
          python src/footage.py \
            --query "Al Khiran Kuwait Google Earth Timelapse" \
            --limit 5 \
            --download-first

      - name: Save downloaded video and credits
        uses: actions/upload-artifact@v4
        with:
          name: wikimedia-test-footage
          path: output/footage/
          if-no-files-found: error
          retention-days: 7
